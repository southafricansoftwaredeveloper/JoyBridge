version: "3.9"

# AMQP -> 5672
# Broker UI (http://localhost:15672) username:guest,password:guest
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      
      - "5672:5672"      
      - "15672:15672"    

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
